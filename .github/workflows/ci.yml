name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} · node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Supported majors only: 22 is the oldest still supported, 24 is what
        # this runs on today, 26 is where it is going. 20 is end-of-life.
        # Platform-specific command building takes the platform as a parameter,
        # so the win32 branch is covered without a Windows runner.
        os: [ubuntu-latest]
        node: ["22", "24", "26"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Package smoke
        run: npm pack --dry-run
