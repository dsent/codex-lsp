name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The property consumers depend on: this repository is vendored as a git
  # submodule and launched straight from the checkout. Nothing here may install
  # or build, because that is not what a consumer does.
  bare-checkout:
    name: bare checkout serves tools (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Committed build output is present
        run: |
          test -f dist/cli.js
          test -f packages/lsp-tools-mcp/dist/cli.js
          test -L node_modules/@code-yeongyu/lsp-tools-mcp
          test -f node_modules/smol-toml/package.json

      - name: MCP server advertises its tools, with no install and no build
        run: |
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            printf '%s\n' '{"jsonrpc":"2.0","id":9,"method":"tools/list"}'
          } | timeout 120 node packages/lsp-tools-mcp/dist/cli.js mcp > tools.jsonl
          node -e '
            const lines = require("fs").readFileSync("tools.jsonl", "utf8").split("\n");
            const want = ["diagnostics","find_references","goto_definition","prepare_rename","rename","status","symbols"];
            for (const l of lines) {
              let j; try { j = JSON.parse(l) } catch { continue }
              if (j.id !== 9) continue;
              const got = j.result.tools.map(t => t.name).sort();
              const missing = want.filter(w => !got.includes(w));
              if (missing.length) { console.error("missing tools:", missing); process.exit(1) }
              console.log("ok:", got.length, "tools");
              process.exit(0);
            }
            console.error("server advertised no tools"); process.exit(1);
          '

      - name: PostToolUse hook reports a syntax error
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua-language-server \
            || { echo "::notice::lua-language-server unavailable; skipping hook check"; exit 0; }
          mkdir -p /tmp/probe && cd /tmp/probe && git init -q .
          printf 'local M = {}\nfunction M.f(a)\n  print("x" .. a\nend\nreturn M\n' > broken.lua
          printf '{"session_id":"0","turn_id":"1","transcript_path":"/tmp/t.jsonl","cwd":"/tmp/probe","hook_event_name":"PostToolUse","model":"m","permission_mode":"default","tool_name":"write","tool_input":{"path":"/tmp/probe/broken.lua"},"tool_response":"ok","tool_use_id":"t"}' \
            | timeout 180 node "$GITHUB_WORKSPACE/dist/cli.js" hook post-tool-use > out.json
          grep -q '"decision":"block"' out.json

  # Source-level checks, plus the guard that committed build output cannot
  # silently drift from the sources it was built from.
  build:
    name: build and tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Build the runtime
        run: |
          cd packages/lsp-tools-mcp
          npm ci
          npm run build

      - name: Install and check
        run: |
          npm ci
          npm run check

      - name: Unit tests
        run: npm test

      - name: Committed dist matches a fresh build
        run: |
          if ! git diff --quiet -- dist packages/lsp-tools-mcp/dist; then
            echo "::error::Committed build output is stale. Rebuild and commit:"
            echo "  (cd packages/lsp-tools-mcp && npm ci && npm run build)"
            echo "  npm install && npm run build"
            echo "  git add -f dist packages/lsp-tools-mcp/dist"
            git --no-pager diff --stat -- dist packages/lsp-tools-mcp/dist
            exit 1
          fi
